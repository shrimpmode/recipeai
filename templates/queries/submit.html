{% extends "base.html" %}

{% block content %}
<style>
  /* CSS-only mode switch: the checked radio decides which form is shown, so it works before any JS loads. */
  #mode-ai:checked ~ #keyword-form,
  #mode-keyword:checked ~ #ai-form { display: none; }
  #mode-ai:checked ~ .mode-switch label[for="mode-ai"],
  #mode-keyword:checked ~ .mode-switch label[for="mode-keyword"] {
    background: #fff; color: #047857; box-shadow: 0 1px 2px rgb(0 0 0 / 0.08);
  }
  #mode-ai:focus-visible ~ .mode-switch label[for="mode-ai"],
  #mode-keyword:focus-visible ~ .mode-switch label[for="mode-keyword"] { outline: 2px solid #10b981; outline-offset: 2px; }
</style>

<h1 class="mb-6 text-2xl font-semibold text-stone-900">What would you like to eat?</h1>

<div>
  <input type="radio" name="search-mode" id="mode-ai" value="ai" class="sr-only" checked>
  <input type="radio" name="search-mode" id="mode-keyword" value="keyword" class="sr-only">

  <div class="mode-switch mb-4 inline-flex rounded-lg bg-stone-200 p-1 text-sm font-medium text-stone-600">
    <label for="mode-ai" class="cursor-pointer rounded-md px-3 py-1.5">AI search</label>
    <label for="mode-keyword" class="cursor-pointer rounded-md px-3 py-1.5">Keyword search</label>
  </div>

  <form id="ai-form" hx-post="{% url 'submit-query' %}" hx-target="#result" hx-swap="innerHTML"
        class="flex gap-2">
    {% csrf_token %}
    <input type="text" name="prompt" aria-label="Describe what you want to eat"
           placeholder="Today I would like to eat something high fiber" required
           class="flex-1 rounded-md border border-stone-300 px-3 py-2 focus:border-emerald-500 focus:outline-none">
    <button type="submit" class="rounded-md bg-emerald-600 px-4 py-2 font-medium text-white hover:bg-emerald-700">Ask</button>
  </form>

  <form id="keyword-form" hx-get="{% url 'keyword-search' %}" hx-target="#result" hx-swap="innerHTML"
        class="flex gap-2">
    <input type="search" name="q" aria-label="Search recipe names and ingredients"
           placeholder="Recipe name or ingredients, e.g. chicken lemon" required
           class="flex-1 rounded-md border border-stone-300 px-3 py-2 focus:border-emerald-500 focus:outline-none">
    <button type="submit" class="rounded-md bg-emerald-600 px-4 py-2 font-medium text-white hover:bg-emerald-700">Search</button>
  </form>
</div>

<div id="result" class="mt-8"></div>
{% endblock %}
