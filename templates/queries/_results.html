<div>
  <div class="mb-4 flex items-baseline justify-between gap-4">
    <h2 class="text-lg font-semibold text-stone-900">Your recipes</h2>
    <p class="text-sm text-stone-500" data-testid="search-elapsed">
      Found in {{ query_request.elapsed_seconds|floatformat:1 }} s
    </p>
  </div>
  <div class="space-y-4">
    {% for recipe in query_request.results %}
      {% include "recipes/_recipe_card.html" %}
    {% endfor %}
  </div>
</div>
