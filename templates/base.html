<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Nutrition{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-stone-50 text-stone-900">
  <nav class="border-b border-stone-200 bg-white">
    <div class="mx-auto flex max-w-2xl items-center justify-between px-4 py-3">
      <a href="{% url 'submit-query' %}" class="text-lg font-semibold text-emerald-700">Nutrition</a>
      <div class="flex items-center gap-4 text-sm">
        {% if user.is_authenticated %}
          <a href="{% url 'submit-query' %}" class="text-stone-600 hover:text-emerald-700">Ask</a>
          <a href="{% url 'edit-profile' %}" class="text-stone-600 hover:text-emerald-700">Profile</a>
          <form action="{% url 'logout' %}" method="post">
            {% csrf_token %}
            <button type="submit" class="text-stone-600 hover:text-emerald-700">Log out</button>
          </form>
        {% else %}
          <a href="{% url 'login' %}" class="text-stone-600 hover:text-emerald-700">Log in</a>
        {% endif %}
      </div>
    </div>
  </nav>

  <main class="mx-auto max-w-2xl px-4 py-8">
    {% for message in messages %}
      <p class="mb-4 rounded-md bg-emerald-50 px-4 py-2 text-sm text-emerald-800">{{ message }}</p>
    {% endfor %}

    {% block content %}{% endblock %}
  </main>
</body>
</html>
