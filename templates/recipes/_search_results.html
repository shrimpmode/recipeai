<div>
  <div class="mb-4 flex items-baseline justify-between gap-4">
    <h2 class="text-lg font-semibold text-stone-900">Matching recipes</h2>
    <p class="text-sm text-stone-500" data-testid="search-elapsed">
      {{ recipes|length }} result{{ recipes|length|pluralize }} in {{ elapsed_ms|floatformat:1 }} ms
    </p>
  </div>
  {% if recipes %}
  <div class="space-y-4">
    {% for recipe in recipes %}
      {% include "recipes/_recipe_card.html" %}
    {% endfor %}
  </div>
  {% else %}
  <p class="rounded-lg border border-stone-200 bg-white px-4 py-3 text-stone-600">
    No recipes have &ldquo;{{ query }}&rdquo; in their name or ingredients.
  </p>
  {% endif %}
</div>
