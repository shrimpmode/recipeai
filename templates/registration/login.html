{% extends "base.html" %}

{% block content %}
<h1 class="mb-6 text-2xl font-semibold text-stone-900">Log in</h1>
<form method="post" class="space-y-4 rounded-lg border border-stone-200 bg-white p-6 shadow-sm [&_input]:w-full [&_input]:rounded-md [&_input]:border [&_input]:border-stone-300 [&_input]:px-3 [&_input]:py-2 [&_input]:focus:border-emerald-500 [&_input]:focus:outline-none [&_label]:mb-1 [&_label]:block [&_label]:text-sm [&_label]:font-medium [&_label]:text-stone-700 [&_ul.errorlist]:mt-1 [&_ul.errorlist]:text-sm [&_ul.errorlist]:text-red-600">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="w-full rounded-md bg-emerald-600 px-4 py-2 font-medium text-white hover:bg-emerald-700">Log in</button>
</form>
{% endblock %}
